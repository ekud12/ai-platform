# Development Tools Policies
# These rules control development tool operations

# === ALLOWED: .NET CLI ===

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet build"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet test"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet run"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet restore"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet clean"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet --version"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet --list-sdks"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet new"
decision = "allow"
priority = 200

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet add"
decision = "allow"
priority = 200

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet sln"
decision = "allow"
priority = 200

[[rule]]
toolName = "run_shell_command"
commandPrefix = "dotnet format"
decision = "allow"
priority = 200

