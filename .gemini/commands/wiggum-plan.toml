description = "Generate a Wiggum execution plan from a specification"

prompt = """
@../agents/roles/planner.agent.md

## Your Task

Read the following specification and generate an execution plan.

## Specification File

!{cat {{args}}}

## Instructions

1. Analyze the specification above
2. Break it down into atomic, sequential steps
3. Assign each step to the appropriate agent:
   - `coder-dotnet` for C#/.NET implementation
   - `coder-typescript` for TypeScript/JavaScript implementation
   - `reviewer-dotnet` for C# code review
   - `reviewer-typescript` for TypeScript code review

4. Output a JSON execution plan in this exact format:

```json
{
  "status": "PLANNING",
  "spec_file": "{{args}}",
  "plan": [
    { "step": 1, "role": "coder-dotnet", "instruction": "Description of what to do" },
    { "step": 2, "role": "coder-dotnet", "instruction": "Description of what to do" },
    { "step": 3, "role": "reviewer-dotnet", "instruction": "Review all changes" }
  ]
}
```

Generate the plan now.
"""
