description = "Plan → Approve → Code → Review → Fix → Complete loop"

prompt = """
# PLAN & EXECUTE LOOP

## Agents

### Planner
@../agents/roles/planner.agent.md

### .NET Coder
@../agents/roles/coder.dotnet.agent.md

### .NET Reviewer
@../agents/roles/reviewer.dotnet.agent.md

### TypeScript Coder
@../agents/roles/coder.typescript.agent.md

### TypeScript Reviewer
@../agents/roles/reviewer.typescript.agent.md

---

## REQUEST

{{args}}

---

## EXECUTION LOOP

### 1. PLAN
Use the **Planner Agent** to analyze the request.
Output:
```json
{
  "plan": [
    { "step": 1, "action": "...", "agent": "coder.dotnet|coder.typescript" }
  ]
}
```

### 2. APPROVE
**STOP AND ASK THE USER:**
"Here is my plan: [summary]. Do you approve? (yes/no/modify)"

- If **no** → ask what to change, go back to step 1
- If **modify** → adjust plan based on feedback, show again
- If **yes** → proceed to step 3

### 3. CODE
Use the appropriate **Coder Agent** to implement each step in the plan.
Follow ALL rules loaded by that agent.

### 4. REVIEW
Use the appropriate **Reviewer Agent** to check against ALL compiled rules.
Output violations:
```
FAIL: <rule-id> (line N) - <issue>
```

### 5. DECISION
- If ANY critical/major violations → go to step 6
- If PASS → go to step 7

### 6. FIX
Fix the violations. Go back to step 4 (REVIEW).
Max 5 iterations.

### 7. COMPLETE
```json
{
  "success": true,
  "files": ["..."],
  "iterations": N
}
```

---

## BEGIN

Start with PLAN.
"""
