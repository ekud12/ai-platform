description = "Plan → Approve → Code → Review → Fix → Complete loop"

prompt = """
# PLAN & EXECUTE LOOP

## REQUEST
{{args}}

## EXECUTION LOOP

### 1. PLAN
Use the **planner** skill to analyze the request and create an execution plan.

### 2. APPROVE
**STOP AND ASK THE USER:**
"Here is my plan: [summary]. Do you approve? (yes/no/modify)"

- If **no** → ask what to change, go back to step 1
- If **modify** → adjust plan, show again
- If **yes** → proceed to step 3

### 3. CODE
Use **coder-dotnet** or **coder-typescript** skill based on the code type.

### 4. REVIEW (STRICT)
Use **reviewer-dotnet** or **reviewer-typescript** skill. 
**The reviewer MUST:**
- Load ALL compiled JSON rules for the language.
- Provide a JSON report with `status: BLOCKED` if any CRITICAL or MAJOR violations exist.
- List specific `rule_id` and `fix` instructions for every violation.

### 5. DECISION
- If status is `BLOCKED` → **MANDATORY FIX REQUIRED**. Go to step 6.
- If status is `PASS` or `PASS_WITH_WARNINGS` → Go to step 7.

### 6. FIX & RE-REVIEW
The **coder** MUST take the `blocking_failures` from the reviewer's JSON report and implement the requested fixes.
After fixing, **RE-RUN STEP 4** (Maximum 5 iterations).

### 7. COMPLETE
Only complete the task when the reviewer provides a `PASS` status.
```json
{
  "success": true,
  "files": ["..."],
  "iterations": N
}
```

## BEGIN
Start with PLAN.
"""
