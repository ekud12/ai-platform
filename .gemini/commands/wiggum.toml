description = "Plan → Code → Review → Fix loop until approved"

prompt = """
# WIGGUM - IMPLEMENT LOOP

You will implement the request below using a strict loop until the code passes review.

## Agents

### Planner
@../agents/roles/planner.agent.md

### .NET Coder
@../agents/roles/coder.dotnet.agent.md

### .NET Reviewer
@../agents/roles/reviewer.dotnet.agent.md

### TypeScript Coder
@../agents/roles/coder.typescript.agent.md

### TypeScript Reviewer
@../agents/roles/reviewer.typescript.agent.md

---

## REQUEST

{{args}}

---

## EXECUTION LOOP

### 1. PLAN
Use the **Planner Agent** to analyze the request and create a plan.

### 2. CODE
Use the appropriate **Coder Agent** (.NET or TypeScript) to write the files.
Follow ALL rules loaded by that agent.

### 3. REVIEW
Use the appropriate **Reviewer Agent** to check against ALL compiled rules.
Output violations:
```
FAIL: <rule-id> (line N) - <issue>
```

### 4. DECISION
- If ANY critical/major violations → go to step 5
- If PASS → go to step 6

### 5. FIX
Fix the violations. Go back to step 3 (REVIEW).
Max 5 iterations.

### 6. FINISH
```json
{
  "success": true,
  "files": ["..."],
  "iterations": N
}
```

---

## BEGIN

Start with PLAN.
"""
